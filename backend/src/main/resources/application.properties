server.port=${PORT:8080}
server.forward-headers-strategy=framework

# MongoDB Atlas: set MONGODB_URI in your environment; never commit credentials.
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:saburi_travel}
spring.mongodb.auto-index-creation=true

app.zone=Asia/Kolkata
# Admin credentials must be supplied through Render environment variables.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.phone=${ADMIN_PHONE:}
app.admin.upi-id=${ADMIN_UPI_ID:}

app.hold-seconds=${APP_HOLD_SECONDS:120}
# Customer cancellation refunds: full (minus convenience fee) if >= full-hours before departure, 50% if >= half-hours, else none
app.refund.full-hours=24
app.refund.half-hours=6

